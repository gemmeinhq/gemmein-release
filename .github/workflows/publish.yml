# Releases ship from this workflow only, triggered by tags from main.

name: publish
on:
  push:
    tags:
      - "engine-v*"
      - "shim-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: shim tests + publish gate
        run: cd shim && npm test
      - name: upload engine artifact
        if: startsWith(github.ref_name, 'engine-v')
        run: |
          VERSION="${GITHUB_REF_NAME#engine-v}"
          test -d "staging/engine/$VERSION" || { echo "no staged artifact for $VERSION"; exit 1; }
          for f in staging/engine/"$VERSION"/*; do
            npx --yes wrangler r2 object put "gemmein-downloads/engine/$VERSION/$(basename "$f")" --file "$f" --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOWNLOADS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: publish shim to npm
        if: startsWith(github.ref_name, 'shim-v')
        run: cd shim && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
