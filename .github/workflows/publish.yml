# Releases ship from this workflow only, triggered by tags from main.

name: publish
on:
  push:
    tags:
      - "engine-v*"
      - "shim-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: shim tests + publish gate
        run: cd shim && npm test
      - name: upload engine artifact
        if: startsWith(github.ref_name, 'engine-v')
        run: |
          echo "engine upload pending CDN configuration"
          exit 1
        env:
          CLOUDFLARE_DOWNLOADS_TOKEN: ${{ secrets.CLOUDFLARE_DOWNLOADS_TOKEN }}
      - name: publish shim to npm
        if: startsWith(github.ref_name, 'shim-v')
        run: cd shim && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
